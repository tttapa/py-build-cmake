[project]
name = "pybind11-project-conan" # Name on PyPI
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ "name" = "Pieter P", "email" = "pieter.p.dev@outlook.com" }]
keywords = ["example", "addition", "subtraction", "pybind11", "conan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
urls = { "Documentation" = "https://tttapa.github.io/" }
dependencies = []
dynamic = ["version", "description"]

[project.scripts]
add = "pybind11_project_conan.add:main"

[project.optional-dependencies]
test = ["pytest>=7.2.0,<9"]

[build-system]
requires = [
    "py-build-cmake~=0.6.0a4.dev0",
    "pybind11-stubgen~=2.5.5",
    "conan~=2.31.2",
]
build-backend = "py_build_cmake.build"

[tool.py-build-cmake.module]
name = "pybind11_project_conan" # Import name
directory = "src"

[tool.py-build-cmake.sdist]
include = ["CMakeLists.txt", "conanfile.*", "cmake/*.cmake", "src/ext"]
exclude = []

[tool.py-build-cmake.conan.cmake]
minimum_version = "4.1"
build_type = "Release"
source_path = "." # Containing CMakeLists.txt
options = {}
args = ["-Wdev"]
build_args = ["-j"]
build_tool_args = []
install_args = ["--verbose"]
install_components = ["python_modules", "python_stubs"]
find_python3_build_artifacts_prefix = "_HOST"
env = {}

[tool.py-build-cmake.linux.conan.cmake] # Linux-specific options
generator = "Ninja"
[tool.py-build-cmake.mac.conan.cmake] # macOS-specific options
generator = "Ninja"
[tool.py-build-cmake.pyodide.conan.cmake] # pyodide-specific options
minimum_version = "4.3.3"
generator = "Ninja"

[tool.py-build-cmake.stubgen]
args = ["-v"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build-verbosity = 1
environment = { PY_BUILD_CMAKE_VERBOSE="1" }
test-command = "pytest {package}/tests"
test-extras = ["test"]
